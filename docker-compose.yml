version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tafs-backend-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      # Connecting to the database specified in the .env configuration
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-change_me_to_a_random_string_123}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_me_to_a_random_string_456}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-noreply@tafs.edu.pk}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-TAFS}
      # DigitalOcean Spaces (S3-compatible object storage for files/photos)
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_CDN_ENDPOINT=${DO_SPACES_CDN_ENDPOINT}
      # Meezan Integration
      - MEEZAN_SERVICE_USER_ID=${MEEZAN_SERVICE_USER_ID}
      - MEEZAN_SERVICE_PASSWORD=${MEEZAN_SERVICE_PASSWORD}
      - MEEZAN_COMPANY_CODE=${MEEZAN_COMPANY_CODE}
      # Firebase Service Account for FCM/notifications
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
    depends_on:
      - db
      - redis

  db:
    image: postgres:18-alpine
    container_name: tafs-backend-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_secure_pass}
      - POSTGRES_DB=tafs
    volumes:
      # Persist PostgreSQL data on the host machine to prevent data loss
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: tafs-backend-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
