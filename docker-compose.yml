version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tafs-backend-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      # Connecting to the database specified in the .env configuration
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-change_me_to_a_random_string_123}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_me_to_a_random_string_456}
      - BREVO_SMTP_HOST=${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      - BREVO_SMTP_PORT=${BREVO_SMTP_PORT:-587}
      - BREVO_SMTP_USER=${BREVO_SMTP_USER}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY}
      - BREVO_FROM_EMAIL=${BREVO_FROM_EMAIL:-no-reply@snaeducationalservices.com}
      - BREVO_FROM_NAME=${BREVO_FROM_NAME:-TAFS}
      - DAILY_DIGEST_RECIPIENTS=${DAILY_DIGEST_RECIPIENTS}
      # DigitalOcean Spaces (S3-compatible object storage for files/photos)
      - DO_SPACES_REGION=${DO_SPACES_REGION}
      - DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - DO_SPACES_BUCKET=${DO_SPACES_BUCKET}
      - DO_SPACES_CDN_ENDPOINT=${DO_SPACES_CDN_ENDPOINT}
      # Meezan Integration
      - MEEZAN_SERVICE_USER_ID=${MEEZAN_SERVICE_USER_ID}
      - MEEZAN_SERVICE_PASSWORD=${MEEZAN_SERVICE_PASSWORD}
      - MEEZAN_COMPANY_CODE=${MEEZAN_COMPANY_CODE}
      # Firebase Service Account for FCM/notifications
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
      # Coral9 integration. This box is Coral9's scheduler — it runs on Vercel,
      # where hourly cron isn't available to them, and we are already always-on
      # and already writing their attendance punches.
      #   CORAL9_DATABASE_URL  scoped coral9_attendance_writer role (punch writes)
      #   CORAL9_FLUSH_SECRET  optional; mails a punch immediately instead of
      #                        waiting for the 10-minute sweep
      #   CORAL9_CRON_SECRET   must equal CRON_SECRET on Coral9; drives the
      #                        client board digests and the attendance-mail sweep
      - CORAL9_DATABASE_URL=${CORAL9_DATABASE_URL}
      - CORAL9_FLUSH_SECRET=${CORAL9_FLUSH_SECRET}
      - CORAL9_CRON_SECRET=${CORAL9_CRON_SECRET}
    depends_on:
      - db
      - redis

  db:
    image: postgres:18-alpine
    container_name: tafs-backend-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_secure_pass}
      - POSTGRES_DB=tafs
    volumes:
      # Persist PostgreSQL data on the host machine to prevent data loss
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: tafs-backend-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
