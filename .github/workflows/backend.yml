name: Backend CI / Deploy

# Every push and PR: typecheck, then build the Docker image and push it to
# DigitalOcean Container Registry tagged with the commit SHA.
# Pushes to main additionally point the App Platform app at that SHA and wait
# for the deploy. Tags are immutable, so rolling back = redeploying an old SHA.
#
# Migrations are NOT run here: `prisma migrate deploy` stays a deliberate,
# manual step (see CLAUDE.md rule 11).
#
# Repo secrets: DIGITALOCEAN_ACCESS_TOKEN. Repo variables: DO_APP_ID.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: registry.digitalocean.com/tafs/tafs-backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json

  image:
    needs: check
    # The push event already builds every branch; skip the duplicate PR run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 1800
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Wait for active bulk voucher jobs
        env:
          APP_ID: ${{ vars.DO_APP_ID }}
        run: |
          INGRESS=$(doctl apps get "$APP_ID" --format DefaultIngress --no-header 2>/dev/null | tr -d '[:space:]')
          if [ -n "$INGRESS" ]; then
            echo "Checking for active bulk voucher jobs on https://$INGRESS/api/v1/bulk-voucher-jobs/active..."
            MAX_WAIT=300
            WAITED=0
            INTERVAL=10
            while [ $WAITED -lt $MAX_WAIT ]; do
              RESPONSE=$(curl -s -f "https://$INGRESS/api/v1/bulk-voucher-jobs/active" || echo '{"active":false}')
              HAS_ACTIVE=$(echo "$RESPONSE" | jq -r '.active // false' 2>/dev/null || echo "false")
              if [ "$HAS_ACTIVE" != "true" ]; then
                echo "No bulk voucher jobs currently processing. Proceeding with deploy."
                break
              fi
              ACTIVE_COUNT=$(echo "$RESPONSE" | jq -r '.count // 1' 2>/dev/null || echo "1")
              echo "Bulk voucher job is currently PROCESSING ($ACTIVE_COUNT active). Waiting ${INTERVAL}s (elapsed: ${WAITED}s / ${MAX_WAIT}s)..."
              sleep $INTERVAL
              WAITED=$((WAITED + INTERVAL))
            done

            if [ $WAITED -ge $MAX_WAIT ]; then
              echo "::error::Deploy aborted: A bulk voucher job has been PROCESSING for over ${MAX_WAIT}s. Aborting deploy to prevent job interruption."
              exit 1
            fi
          else
            echo "Ingress URL not found or DO_APP_ID empty; skipping active job check."
          fi
      - name: Point the app at this commit's image and deploy
        env:
          APP_ID: ${{ vars.DO_APP_ID }}
          TAG: ${{ github.sha }}
        run: |
          # The fetched spec carries secrets as EV[...] ciphertext, so writing
          # it back preserves them without the workflow ever seeing plaintext.
          doctl apps spec get "$APP_ID" --format yaml > spec.yaml
          yq -i '(.services[] | select(.name == "api") | .image.tag) = strenv(TAG)' spec.yaml
          doctl apps update "$APP_ID" --spec spec.yaml --wait
          doctl apps get "$APP_ID" --format ID,DefaultIngress,ActiveDeployment.ID,Updated
